<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Stationery Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#B80024',
            brandDark: '#93001b'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-[#F8F9FB] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="card-soft rounded-[32px] bg-white p-8 shadow-2xl">
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-3xl bg-[#B80024] text-white flex items-center justify-center text-2xl font-semibold mx-auto mb-4">S</div>
        <h1 class="text-2xl font-semibold text-slate-900">Login Page</h1>
        <p class="text-sm text-slate-500 mt-2">Enter your credentials to access the system</p>
        <div id="serverStatusMessage" class="hidden mt-4 rounded-3xl bg-rose-50 border border-rose-100 px-4 py-3 text-sm text-rose-700"></div>
      </div>

      <form id="loginForm" onsubmit="return handleLogin(event)" class="space-y-6">
        <div id="formLoginError" class="hidden rounded-3xl bg-rose-50 border border-rose-100 px-4 py-3 text-sm text-rose-700">Invalid username or password.</div>
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-2">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username" class="w-full rounded-3xl border border-slate-200 px-4 py-3 focus:border-[#B80024] focus:ring-2 focus:ring-[#B80024]/20 outline-none" />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-2">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password" class="w-full rounded-3xl border border-slate-200 px-4 py-3 focus:border-[#B80024] focus:ring-2 focus:ring-[#B80024]/20 outline-none" />
        </div>

        <div>
          <label for="loginRole" class="block text-sm font-medium text-slate-700 mb-2">Login as</label>
          <select id="loginRole" name="role" class="w-full rounded-3xl border border-slate-200 px-4 py-3 focus:border-[#B80024] focus:ring-2 focus:ring-[#B80024]/20 outline-none bg-white">
              <option value="admin">Admin Dashboard</option>
              <option value="staff">Staff Dashboard</option>
          </select>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input type="checkbox" class="rounded border-slate-300 text-[#B80024] focus:ring-[#B80024]/20" />
            <span class="ml-2 text-sm text-slate-600">Remember me</span>
          </label>
          <a href="#" class="text-sm text-[#B80024] hover:text-[#93001b]">Forgot password?</a>
        </div>

        <button id="loginSubmitButton" type="submit" class="w-full rounded-3xl bg-[#B80024] py-3 text-white font-semibold hover:bg-[#93001b] transition">Sign In</button>
      </form>



      <div class="mt-6 text-center">
        <p class="text-sm text-slate-500">Don't have an account? <a href="#" class="text-[#B80024] hover:text-[#93001b] font-semibold">Contact Admin</a></p>
      </div>
    </div>
  </div>
  <script src="scripts/auth.js?v=4"></script>
  <script src="scripts/login.js?v=4"></script>
  <script>document.addEventListener('DOMContentLoaded', checkBackendConnection);</script>
</body>
</html>
